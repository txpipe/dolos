[upstream]
peer_address = "relay.cnode-m1.demeter.run:3002"

[storage]
version = "v4"
path = "data"

[genesis]
byron_path = "byron.json"
shelley_path = "shelley.json"
alonzo_path = "alonzo.json"
conway_path = "conway.json"
force_protocol = 6

[sync]

[serve.ouroboros]
listen_path = "dolos.socket"

[serve.grpc]
listen_address = "[::]:6550"

[serve.minibf]
listen_address = "[::]:6551"

[serve.trp]
listen_address = "[::]:6552"

[serve.minikupo]
listen_address = "[::]:6553"

[chain]
type = "cardano"
magic = 2
is_testnet = true
