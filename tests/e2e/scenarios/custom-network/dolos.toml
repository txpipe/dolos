compatibility = "v2-alpha.2"

[chain]
protocol = "cardano"
network = "custom"

[chain.cardano]
magic = 2
is_testnet = true

[chain.cardano.genesis]
byron_path = "byron.json"
shelley_path = "shelley.json"
alonzo_path = "alonzo.json"
conway_path = "conway.json"

[upstream]
type = "emulator"
block_production_interval = 10

[storage]
path = "data"

[serve.ouroboros]
listen_path = "dolos.socket"

[serve.grpc]
listen_address = "[::]:6590"

[serve.minibf]
listen_address = "[::]:6591"

[serve.trp]
listen_address = "[::]:6592"

[serve.minikupo]
listen_address = "[::]:6593"
