compatibility = "v2-alpha.2"

[chain]
protocol = "cardano"
network = "preview"

[upstream]
type = "peer"
peer_address = "relay.cnode-m1.demeter.run:3002"

[sync]
wal_path = "wal"
pull_batch_size = 20

[sync.retry]
max_retries = 20
backoff_unit_seconds = 2
backoff_factor = 2
max_backoff_seconds = 60
dismissible = false

[storage]
path = "data"

[storage.state]
type = "fjall"
path = "state"
preset = "standard"

[storage.archive]
type = "fjall"
path = "archive"
blocks_path = "blocks"
preset = "standard"

[storage.cache]
enabled = true
path = "cache"
memory_mb = 512
disk_mb = 4096

[history]
mode = "rolling"
window = { unit = "slot", value = 86400 }

[mempool]
persistent = false
path = "mempool"
retain_confirmed_blocks = 6

[serve]
max_concurrent_queries = 32

[serve.ouroboros]
listen_path = "dolos.socket"

[serve.grpc]
listen_address = "[::]:6540"
permissive_cors = true

[serve.minibf]
listen_address = "[::]:6541"
permissive_cors = true
token_registry_url = ""
public_url = ""
max_scan_items = 3000

[serve.trp]
listen_address = "[::]:6542"
max_optimize_rounds = 10
permissive_cors = true
extra_fees_lovelace = 0

[serve.minikupo]
listen_address = "[::]:6543"
permissive_cors = true

[relay]
listen_address = "[::]:6544"

[logging]
level = "info"
filter = "fjall=warn"
