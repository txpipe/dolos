name: Epoch Tests

on:
  workflow_dispatch:
    inputs:
      network:
        description: Run only this network's entries
        type: choice
        options: [all, mainnet, preprod, preview]
        default: all
      tag:
        description: Run only the entries carrying this tag in tests/epoch_pots/matrix.json
        type: choice
        options: [all, conway]
        default: all

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.filter.outputs.entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter the matrix
        id: filter
        env:
          NETWORK: ${{ inputs.network }}
          TAG: ${{ inputs.tag }}
        run: |
          entries=$(jq -c --arg network "$NETWORK" --arg tag "$TAG" '
            map(select($network == "all" or .network == $network)
              | select($tag == "all" or ((.tags // []) | any(. == $tag))))
          ' tests/epoch_pots/matrix.json)
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.network)-\(.ground_truth_epoch)"' <<< "$entries"

  epoch-test:
    needs: select
    if: needs.select.outputs.entries != '[]'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.select.outputs.entries) }}

    name: "${{ matrix.network }}-${{ matrix.ground_truth_epoch }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-epoch-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-epoch-tests-

      # Each archive streams into tar, so no copy of it sits on disk. Skip the
      # AppleDouble `._*` files a macOS tar can add: the store and the chunk
      # reader would take them for their own files.
      - name: Download seed
        run: |
          mkdir -p /tmp/fixtures/seeds
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/seeds/${{ matrix.network }}-${{ matrix.seed_epoch }}.tar" - | tar xf - --exclude='._*' -C /tmp/fixtures/seeds

      - name: Download ground truth
        run: |
          mkdir -p /tmp/fixtures/ground-truth
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/ground-truth/${{ matrix.network }}-${{ matrix.ground_truth_epoch }}.tar" - | tar xf - --exclude='._*' -C /tmp/fixtures/ground-truth

      - name: Download upstream
        run: |
          mkdir -p /tmp/fixtures/upstream
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/upstream/${{ matrix.network }}-${{ matrix.upstream_range }}.tar" - | tar xf - --exclude='._*' -C /tmp/fixtures/upstream
          df -h /

      # An optimised build keeps the replay inside the job limit; the debug
      # assertions and overflow checks of a debug build stay on.
      - name: Run epoch test
        env:
          DOLOS_FIXTURE_DIR: /tmp/fixtures
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
          CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
        run: cargo test --release --test epoch_pots -- --nocapture

      - name: Cleanup
        if: always()
        run: rm -rf /tmp/fixtures
