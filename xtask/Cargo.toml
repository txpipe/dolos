[package]
name = "xtask"
version = "0.1.0"
edition = "2021"
description = "Custom build scripts and development tasks for dolos"

[[bin]]
name = "cargo-xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = "0.8.13"
xshell = "0.2"
dolos = { path = "..", default-features = false }
dolos-core = { path = "../crates/core" }
dolos-cardano = { path = "../crates/cardano", features = ["include-genesis"] }
hex = { workspace = true }
postgres = "0.19"
postgres-native-tls = "0.5"
bech32 = { workspace = true }
pallas = { workspace = true }
chrono = { workspace = true, features = ["clock"] }
dolos-flatfiles = { path = "../crates/flatfiles" }
dolos-minibf = { path = "../crates/minibf" }
dolos-testing = { path = "../crates/testing" }
axum = "0.8.4"
tower = { workspace = true, features = ["util"] }
reqwest = { workspace = true }
hdrhistogram = "7.5"
libc = "0.2"
sha2 = "0.10"
tokio = { workspace = true }
tonic = "0.12.3"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
vergen-gitcl = "9.1.0"
