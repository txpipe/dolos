compatibility = "v2-alpha.2"

[chain]
protocol = "cardano"
network = "preview"

[upstream]
peer_address = "preview-node.world.dev.cardano.org:30002"

[storage]
path = "data"

[serve.grpc]
listen_address = "[::]:50051"

[serve.ouroboros]
listen_path = "dolos.socket"

[serve.minibf]
listen_address = "[::]:3000"

[logging]
level = "debug"
