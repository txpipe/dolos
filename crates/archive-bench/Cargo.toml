[package]
name = "dolos-archive-bench"
description = "Developer benchmarks for per-block compressed archive segments"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "dolos-archive-bench"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { workspace = true, features = ["clock"] }
clap = { version = "4.5.37", features = ["derive"] }
dolos-flatfiles = { path = "../flatfiles" }
hdrhistogram = "7.5"
libc = "0.2"
pallas = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = "3"
