[package]
name = "dolos-snapshot"
description = "The io.txpipe.dolos.cardano Stelae profile"
version.workspace = true
edition.workspace = true

# This crate is the *profile* half of the Stelae boundary: it depends on the
# stelae crates and on `dolos-*`, never the other way around — structural now
# that the protocol lives in its own repository. This is the workspace's
# pin point: the CLI and root lib reach protocol and driver types through
# this crate's re-exports, and both crates move here together to one
# immutable stelae reference: a release tag or, between releases, a commit
# `rev` (they version in lockstep; never pin a branch). The root crate's
# dev-dependencies repeat the reference for its tests and move with it. See
# adrs/004_stelae_snapshots.md, "Code layout".
[dependencies]
# The protocol crates keep their own default-off `oci` feature for third
# parties; this profile publishes into registries as a matter of course, so
# it turns the transport on unconditionally rather than forwarding a feature
# nothing in dolos ever left off.
#
# Pinned at b2735ed, the stelae main commit that holds a repository in a
# directory as an OCI image layout (txpipe/stelae#36), over the diff chain:
# inscriptions listing their own layers in `diff` and `tip`, linked by
# `previous`. It also holds the blocks profile and its plain writer
# (txpipe/stelae#29).
stelae = { git = "https://github.com/txpipe/stelae", rev = "b2735ed829cbafdc57273a42871510aa564b00b3", features = ["oci"] }
stelae-driver = { git = "https://github.com/txpipe/stelae", rev = "b2735ed829cbafdc57273a42871510aa564b00b3", features = ["oci"] }
# The `io.txpipe.cardano.blocks` profile, which a restore reads the closed
# epochs' blocks through. Without its `hardano` feature, so pallas-hardano
# does not come with it.
stelae-blocks = { git = "https://github.com/txpipe/stelae", rev = "b2735ed829cbafdc57273a42871510aa564b00b3" }
dolos-core = { path = "../core" }
dolos-cardano = { path = "../cardano" }

hex.workspace = true
minicbor.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = "3.20.0"
thiserror.workspace = true
tracing.workspace = true
xxhash-rust.workspace = true

[target.'cfg(unix)'.dependencies]
# Flags for opening what a sweep finds in a shared scratch directory.
libc = "0.2"

[dev-dependencies]
# `node`'s tests build a `[storage]` section the way an operator writes one.
toml = "0.8.13"

# The registry suites install `ring` as the process-default crypto provider —
# the precondition `stelae::oci` puts on whatever process opens a `Registry`.
# The `dolos` binary does it in `main()`; under `cargo test` the test binary
# is the program, so it does it in the fixture. Mirrors the same
# dev-dependency in `crates/stelae`.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }

# The export tests drive real store sets through `dolos-testing`'s harness
# domain and its backend bindings.
dolos-testing = { path = "../testing" }

# The restore suite walks a restored fjall archive's segment files with
# libzstd alone and decodes the blocks it appends afterwards.
dolos-fjall = { path = "../fjall" }
pallas = { workspace = true }
zstd = "0.14"
