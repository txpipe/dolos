[package]
name = "dolos-snapshot"
description = "The io.txpipe.dolos.cardano Stelae profile"
version.workspace = true
edition.workspace = true

# This crate is the *profile* half of the Stelae boundary: it may depend on
# `stelae` and on `dolos-*`, never the other way around. See
# adrs/004_stelae_snapshots.md, "Code layout".
[dependencies]
stelae = { path = "../stelae" }
dolos-core = { path = "../core" }
dolos-cardano = { path = "../cardano" }

fs4.workspace = true
hex.workspace = true
minicbor.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.20.0"

# The export tests drive real store sets: `dolos-testing` for the harness
# domain and its two backend bindings, `dolos-redb3` for the archive, which is
# the one store with no builtin backend.
dolos-testing = { path = "../testing" }
dolos-redb3 = { path = "../redb3" }
