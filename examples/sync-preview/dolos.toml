[upstream]
peer_address = "relay.cnode-m1.demeter.run:3002"

[storage]
version = "v4"
path = "data"

[genesis]
byron_path = "byron.json"
shelley_path = "shelley.json"
alonzo_path = "alonzo.json"
conway_path = "conway.json"
force_protocol = 6

[sync]
max_history = 2592000
max_rollback = 25920

[submit]
prune_height = 200

[serve.grpc]
listen_address = "[::]:50051"

[serve.ouroboros]
listen_path = "dolos.socket"

[serve.minibf]
listen_address = "[::]:3000"

[chain]
type = "cardano"
magic = 2
is_testnet = true

[logging]
max_level = "DEBUG"
